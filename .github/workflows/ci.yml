name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not `latest`. bun.lock is written by whichever bun runs
          # `bun install`, and `--frozen-lockfile` below rejects a lockfile a
          # different version would rewrite -- so `latest` lets an unrelated
          # bun release break CI with no change to this repo. Bump this in the
          # same commit as the lockfile it produces.
          bun-version: 1.2.20

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build packages
        run: bun run build:packages

      - name: dist must be committed
        # Consumers install via github:tyandor/tyandor-design#path:packages/tokens,
        # and git dependencies have no build step. A stale dist ships broken tokens.
        run: |
          if ! git diff --quiet -- packages/*/dist; then
            echo "::error::dist/ is out of date. Run 'bun run build:packages' and commit the result."
            git diff --stat -- packages/*/dist
            exit 1
          fi

      - name: Contrast gate (WCAG AA)
        run: bun run check:contrast

      - name: Build docs
        # Verification-only: catches type errors, missing tokens, broken imports.
        # Deployment goes through the `vercel` CLI; CI does not push to Vercel.
        run: bun run build:docs

      - name: Test
        run: bun run test

  visual:
    # Separate job so a ~95 MB browser download never sits in front of the
    # typecheck/contrast gates. Runs the same production build the deploy
    # ships, because dev-mode style injection differs from the built sheet.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:packages

      - name: Build docs
        run: bun run build:docs

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Visual verification
        run: bun run test:visual

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
