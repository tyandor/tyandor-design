name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build tokens
        run: bun run build

      - name: dist must be committed
        # Consumers install via github:tyandor/tyandor-design#path:packages/tokens,
        # and git dependencies have no build step. A stale dist ships broken tokens.
        run: |
          if ! git diff --quiet -- packages/*/dist; then
            echo "::error::dist/ is out of date. Run 'bun run build' and commit the result."
            git diff --stat -- packages/*/dist
            exit 1
          fi

      - name: Contrast gate (WCAG AA)
        run: bun run check:contrast

      - name: Test
        run: bun test
